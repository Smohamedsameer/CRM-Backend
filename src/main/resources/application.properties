# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8080}

# ==========================================
# APPLICATION
# ==========================================
spring.application.name=lead-quote-system


# ==========================================
# MYSQL DATABASE
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crmofsenela}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ==========================================
# EMAIL
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ==========================================
# JWT SECURITY
# ==========================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# WHATSAPP
# ==========================================
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api-version=${WHATSAPP_API_VERSION:v20.0}
#whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}


# ==========================================
# COMPANY
# ==========================================
company.name=${COMPANY_NAME:Senela International Ventures}
company.phone=${COMPANY_PHONE:+91 9585901999}
company.email=${COMPANY_EMAIL:senelainternational@gmail.com}
company.address=${COMPANY_ADDRESS:Porur, Chennai, Tamilnadu, India.}
company.gst-number=${COMPANY_GST_NUMBER:}
company.logo-path=${COMPANY_LOGO_PATH:}
company.public-base-url=${COMPANY_PUBLIC_BASE_URL:http://localhost:8080}


# ==========================================
# APPLICATION SETTINGS
# ==========================================
app.pdf-storage-dir=${PDF_STORAGE_DIR:./storage/quotations}
app.enquiry-token-validity-hours=${ENQUIRY_TOKEN_VALIDITY_HOURS:168}
app.quotation-validity-days=${QUOTATION_VALIDITY_DAYS:15}


# ==========================================
# PRICING
# ==========================================
pricing.rate-per-square-foot=${PRICING_RATE_PER_SQFT:20.00}
pricing.default-additional-charges=${PRICING_DEFAULT_ADDITIONAL_CHARGES:0.00}
pricing.default-discount-percentage=${PRICING_DEFAULT_DISCOUNT_PERCENTAGE:0.00}
pricing.default-tax-percentage=${PRICING_DEFAULT_TAX_PERCENTAGE:18.00}


# ==========================================
# LOGGING
# ==========================================
logging.level.com.leadquote=${LOG_LEVEL:INFO}


